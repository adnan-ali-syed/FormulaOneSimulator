[project]
name = "formulaonesimulator"
version = "0.2.0"
description = "Grid Battle: an interactive Formula One driver-vs-driver scenario simulator."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Formula One Simulator Datathon Team" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.5,<2",
    "jupyter>=1.1,<2",
    "matplotlib>=3.8,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=5.24,<8",
    "scikit-learn==1.8.0",
    "streamlit>=1.40,<2",
]

[project.scripts]
formulaonesimulator = "formulaonesimulator:main"
f1-train = "f1_predictor.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
